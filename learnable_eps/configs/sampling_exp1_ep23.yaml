stage_1:
  target: stage1.RAE
  params:
    encoder_cls: Dinov2withNorm
    encoder_config_path: facebook/dinov2-with-registers-base
    encoder_input_size: 224
    encoder_params:
      dinov2_path: facebook/dinov2-with-registers-base
      normalize: true
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: models/stats/dinov2/wReg_base/imagenet1k/stat.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size:
    - 1152
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 16
    - 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true
  ckpt: ckpts/stage2/exp1_rapid_q0.5_XL/checkpoints/ep-0000023.pt
transport:
  params:
    path_type: Linear
    prediction: velocity
    loss_weight: null
    time_dist_type: logit-normal_0_1
sampler:
  mode: ODE
  params:
    sampling_method: euler
    num_steps: 50
    atol: 1.0e-06
    rtol: 0.001
    reverse: false
guidance:
  method: cfg
  scale: 1.0
  t_min: 0.0
  t_max: 1.0
misc:
  latent_size:
  - 768
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096
prior:
  enable: true
  ckpt_path: gmm_prior_k20/gmm_rae.pkl
  lpf_alpha: 1.0
  q0: 0.5
  decay_alpha: 1.0
  schedule: exp
  use_weight: true
  stochastic_assign: false
  means_device: cpu
